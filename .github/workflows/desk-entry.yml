name: desk-entry
# Checks for a qualifying setup EVERY 2 HOURS (not a fixed time) so trades fire when IV/
# conditions warrant. A no-duplicate guard means each setup is only signalled once.
on:
  schedule:
    - cron: '5 */2 * * *'    # every 2 hours (general scan)
    - cron: '0 9 * * *'      # 09:00 UTC = 14:30 IST (3h to expiry — butterfly window opens)
    - cron: '30 10 * * *'    # 10:30 UTC = 16:00 IST (1.5h to expiry — butterfly sweet spot)
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to commit logs/data back to the repo

concurrency:                 # don't let two runs push at once
  group: desk-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
      DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      DELTA_BASE_URL: https://api.india.delta.exchange
      DRY_RUN: 'false'
      SYMBOLS: BTC,ETH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: entry signal
        working-directory: bot
        run: python3 run_desk.py --mode entry
      - name: persist data
        if: always()
        run: |
          git config user.name "deltahedge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git commit -m "entry $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
