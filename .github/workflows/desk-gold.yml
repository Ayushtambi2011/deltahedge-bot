name: desk-gold
# Gold 20/50 EMA on the 15-min chart. Runs every 15 min (needs public repo for unlimited Actions).
# Checks for a 3rd-retest entry AND settles any open gold trade that hit TP/SL.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desk-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DELTA_BASE_URL: https://api.india.delta.exchange
      GOLD_SYMBOL: XAUTUSD
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: gold 20/50 EMA scan + exits
        working-directory: bot
        run: python3 run_desk.py --mode gold
      - name: persist data
        if: always()
        run: |
          git config user.name "deltahedge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A 2>/dev/null || true
          git commit -m "gold $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
