name: desk-monitor
# Position adjustment / IV alerts. HOURLY on Actions (GitHub cron can't reliably do 10-min).
# This is the one real downside vs a VPS — intraday monitoring is coarser here.
on:
  schedule:
    - cron: '35 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desk-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DELTA_BASE_URL: https://api.india.delta.exchange
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: monitor open positions
        working-directory: bot
        run: python3 run_desk.py --mode monitor
      - name: persist data
        if: always()
        run: |
          git config user.name "deltahedge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git commit -m "monitor $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
