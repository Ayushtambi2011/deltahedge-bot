name: desk-nightly
# Settle expired paper trades, send heartbeat, and (Sundays) run the learning review.
# 20:00 UTC.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desk-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DELTA_BASE_URL: https://api.india.delta.exchange
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: settle + rebuild dashboard feed
        working-directory: bot
        run: python3 paper_tracker.py
      - name: heartbeat
        working-directory: bot
        run: python3 heartbeat.py
      - name: weekly learning review (Sundays)
        working-directory: bot
        run: if [ "$(date -u +%u)" = "7" ]; then python3 learning_review.py; else echo "not Sunday"; fi
      - name: persist data
        if: always()
        run: |
          git config user.name "deltahedge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git commit -m "nightly $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
